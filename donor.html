<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="format-detection" content="telephone=no">
<meta name="robots" content="noindex, nofollow">
<!-- the address carries the donor's private link: only the site's name is ever sent on to map tiles and other sites -->
<meta name="referrer" content="strict-origin">
<title>Your projects — RAFIKI Outreach</title>
<meta name="description" content="Your private RAFIKI Outreach project page.">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="theme-color" content="#0A78C2">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/vendor/leaflet/leaflet.css">
<style>
:root{--blue:#0A78C2;--blue2:#076DB1;--deep:#054F81;--ink:#04263F;--sky:#6BBDF2;--tint:#E3F1FC;--bg:#FAF8F3;--card:#FFFFFF;--text:#141618;--muted:#454C53;--line:#DCE1E6;--edge:#B5C0C9;
  --ok:#1C7C4A;--okbg:#E2F4EA;--warn:#8A5200;--amber:#D98200;--warnbg:#FDF0DC;--bad:#B3261E;--badbg:#FBE7E5;--build:#7A4FD0;--buildbg:#EFE8FB;--plan:#5A6066;--r:22px;--R:28px}
*{box-sizing:border-box}
html{scroll-padding-top:84px;-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--text);font:calc(17px*var(--fs))/1.55 Montserrat,system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased;overflow-x:clip}
button,input{font:inherit;color:inherit}
a{color:var(--blue2)}
img{max-width:100%}
.vh{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.wrap{max-width:1180px;margin:0 auto;padding:0 16px}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
/* header */
.top{position:sticky;top:0;z-index:1200;background:rgba(255,255,255,.96);-webkit-backdrop-filter:saturate(1.4) blur(10px);backdrop-filter:saturate(1.4) blur(10px);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:12px;min-height:64px}
.top .home img{height:30px;width:auto;display:block}
.top .sp{flex:1}
.top .priv{display:none;align-items:center;gap:6px;font-size:calc(13px*var(--fs));font-weight:600;color:var(--muted)}
.top .priv svg{width:16px;height:16px}
@media (min-width:760px){.top .priv{display:inline-flex}}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 22px;border-radius:999px;border:0;background:var(--blue);color:#FFFFFF;font-weight:700;font-size:calc(15px*var(--fs));text-decoration:none;cursor:pointer;transition:transform .15s,box-shadow .2s,background .2s;white-space:nowrap}
.btn:hover{background:var(--blue2);box-shadow:0 8px 20px rgba(10,120,194,.25)}
.btn:active{transform:scale(.97)}
.btn.light{background:#FFFFFF;color:var(--ink);border:1px solid var(--edge)}
.btn.light:hover{background:var(--tint);box-shadow:none}
.btn.white{background:#FFFFFF;color:var(--blue2)}
.btn.ghost{background:rgba(255,255,255,.16);color:#FFFFFF;border:1px solid rgba(255,255,255,.45)}
.btn.ghost:hover{background:rgba(255,255,255,.26)}
.btn svg{width:18px;height:18px;flex:0 0 auto}
.btn.sm{min-height:44px;padding:0 16px;font-size:calc(14px*var(--fs))}
/* hero */
.hero{margin-top:16px;border-radius:var(--R);color:#FFFFFF;background:radial-gradient(120% 140% at 100% 0%,#3EA6EC 0%,#0A78C2 38%,#054F81 75%,#04263F 100%);padding:28px 20px 22px;position:relative;overflow:hidden;isolation:isolate}
.hero::before{content:"";position:absolute;right:-60px;top:-60px;width:260px;height:260px;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.22),rgba(255,255,255,0) 70%);z-index:-1}
.hero .kick{display:inline-flex;align-items:center;gap:6px;background:rgba(255,255,255,.16);border-radius:999px;padding:5px 12px;font-size:calc(12px*var(--fs));font-weight:700;letter-spacing:.06em;text-transform:uppercase}
.hero .kick svg{width:14px;height:14px}
.hero h1{font-size:clamp(32px,7vw,58px);line-height:1.02;letter-spacing:-.035em;font-weight:800;margin:14px 0 6px}
.hero .org{margin:0;color:#CFE8FA;font-weight:600}
.hero .say{font-size:clamp(19px,3.2vw,26px);line-height:1.3;font-weight:700;margin:18px 0 0;max-width:30ch;letter-spacing:-.01em}
.hero .say b{color:#FFFFFF;background:linear-gradient(transparent 62%,rgba(107,189,242,.55) 62%)}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:22px}
.stat{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.22);border-radius:20px;padding:14px 14px 12px;min-width:0}
.stat b{display:block;font-size:clamp(26px,5.5vw,38px);font-weight:800;letter-spacing:-.03em;line-height:1.05;font-variant-numeric:tabular-nums}
.stat span{display:block;font-size:calc(13px*var(--fs));font-weight:600;color:#D7ECFB;margin-top:4px;line-height:1.3}
.hero .acts{display:flex;flex-wrap:wrap;gap:10px;margin-top:20px}
.hero-ph{display:none}
@media (min-width:1000px){.hero.has-ph{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:0 48px;align-items:center}.hero.has-ph .stats,.hero.has-ph .acts{grid-column:1/-1}
  .hero-ph{display:block;grid-column:2;grid-row:1;margin:0;position:relative;transform:rotate(2deg)}
  .hero-ph img{width:100%;aspect-ratio:4/5;object-fit:cover;border-radius:24px;border:6px solid rgba(255,255,255,.9);box-shadow:0 20px 40px rgba(4,38,63,.35);display:block}
  .hero-ph figcaption{position:absolute;left:18px;bottom:18px;background:rgba(4,38,63,.78);border-radius:999px;padding:5px 12px;font-size:calc(13px*var(--fs));font-weight:700}}
@media (min-width:760px){.hero{padding:40px 40px 34px}.stats{grid-template-columns:repeat(4,1fr);gap:14px}}
/* anniversary */
.anni{margin-top:16px;border-radius:var(--R);background:linear-gradient(135deg,#FFF6E0,#FDE7C2);border:1px solid #F3D49A;padding:18px;display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:start;color:#5B3600}
.anni > span{display:block}
.anni .ph{width:84px;height:84px;border-radius:18px;object-fit:cover;background:#F3D49A;display:flex;align-items:center;justify-content:center;font-size:calc(40px*var(--fs))}
.anni h2{margin:0;font-size:calc(20px*var(--fs));letter-spacing:-.02em;color:#4A2C00}
.anni p{margin:4px 0 0;font-size:calc(14px*var(--fs))}
.anni button{margin-top:8px}
/* sections */
section.blk{margin-top:34px}
.sh{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:12px}
.sh h2{margin:0;font-size:clamp(24px,3.4vw,34px);letter-spacing:-.03em;line-height:1.08;font-weight:800;color:#0A0A0A}
.sh p{margin:4px 0 0;color:var(--muted);font-size:calc(14px*var(--fs))}
/* map */
.leaflet-container{font-family:inherit}
@keyframes up{from{transform:translateY(12px);opacity:0}to{transform:none;opacity:1}}
/* badges */
.badge{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:4px 10px;font-size:calc(12px*var(--fs));font-weight:700;background:var(--bg2,#EEF0F2);color:var(--fg,#141618);white-space:nowrap}
.badge::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--c)}
.b-working{--c:var(--ok);--bg2:var(--okbg);--fg:#0F5432}
.b-repairing{--c:var(--amber);--bg2:var(--warnbg);--fg:var(--warn)}
.b-notworking{--c:var(--bad);--bg2:var(--badbg);--fg:var(--bad)}
.b-building{--c:var(--build);--bg2:var(--buildbg);--fg:#4B2A93}
.b-planned{--c:var(--plan);--bg2:#EEF0F2;--fg:#3B4045}
.b-done{--c:var(--blue);--bg2:var(--tint);--fg:var(--deep)}
.checked{font-size:calc(12px*var(--fs));color:var(--muted);font-weight:600}
/* project cards */
.grid{display:grid;grid-template-columns:1fr;gap:14px}
@media (min-width:640px){.grid{grid-template-columns:1fr 1fr}}
@media (min-width:1000px){.grid{grid-template-columns:repeat(3,1fr)}}
.pj{display:flex;flex-direction:column;text-align:left;border:1px solid var(--line);background:var(--card);border-radius:var(--r);overflow:hidden;padding:0;cursor:pointer;transition:transform .2s,box-shadow .2s;color:inherit}
.pj:hover{transform:translateY(-3px);box-shadow:0 14px 30px rgba(4,38,63,.12)}
.pj .ph{aspect-ratio:16/10;background:var(--tint);position:relative;overflow:hidden}
.pj .ph img{width:100%;height:100%;object-fit:cover;display:block}
.pj .ph .badge{position:absolute;left:12px;top:12px;box-shadow:0 2px 8px rgba(0,0,0,.15)}
.pj .ph .noimg{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--blue)}
.pj .ph .noimg svg{width:48px;height:48px;opacity:.6}
.pj .bd{padding:14px 16px 16px;display:flex;flex-direction:column;gap:4px;flex:1}
.pj .bd b{font-size:calc(18px*var(--fs));letter-spacing:-.015em;line-height:1.2;color:var(--ink)}
.pj .bd small{color:var(--muted);font-size:calc(13px*var(--fs));font-weight:600}
.pj .nums{display:flex;gap:16px;margin-top:10px;flex-wrap:wrap}
.pj .nums div{min-width:0}
.pj .nums strong{display:block;font-size:calc(20px*var(--fs));color:var(--ink);letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.pj .nums span{font-size:calc(12px*var(--fs));color:var(--muted);font-weight:600}
.pj .go{margin-top:auto;padding-top:12px;font-weight:700;font-size:calc(14px*var(--fs));color:var(--blue2);display:flex;align-items:center;gap:6px}
.pj .go svg{width:16px;height:16px}
/* updates */
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 6px;margin:0 -2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;min-height:44px;padding:0 18px;border-radius:999px;border:1px solid var(--edge);background:#FFFFFF;font-weight:700;font-size:calc(14px*var(--fs));color:var(--ink);cursor:pointer}
.chip[aria-pressed=true]{background:var(--ink);border-color:var(--ink);color:#FFFFFF}
.chip i{font-style:normal;opacity:.7;margin-left:4px;font-weight:600}
.feed{list-style:none;margin:12px 0 0;padding:0;display:flex;flex-direction:column;gap:10px}
.up{display:grid;grid-template-columns:42px 1fr;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:14px}
.up .ic{width:42px;height:42px;border-radius:14px;display:flex;align-items:center;justify-content:center;background:var(--b,var(--tint));color:var(--c,var(--blue))}
.up .ic svg{width:22px;height:22px}
.up .hd{display:flex;justify-content:space-between;gap:10px;align-items:baseline;flex-wrap:wrap}
.up .hd b{font-size:calc(15px*var(--fs));color:var(--ink)}
.up .hd time{font-size:calc(12px*var(--fs));color:var(--muted);font-weight:600;white-space:nowrap}
.up .pn{border:0;background:none;padding:0;font-weight:700;font-size:calc(13px*var(--fs));color:var(--blue2);cursor:pointer;text-align:left;min-height:28px}
.up p{margin:4px 0 0;font-size:calc(14px*var(--fs))}
.up .facts{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.up .facts span{background:#F2F4F6;border-radius:999px;padding:3px 10px;font-size:calc(12px*var(--fs));font-weight:600;color:#3B4045}
.up blockquote{margin:6px 0 0;font-size:calc(16px*var(--fs));font-weight:600;color:var(--ink);line-height:1.45}
.up blockquote cite{display:block;font-size:calc(13px*var(--fs));font-style:normal;color:var(--muted);margin-top:2px;font-weight:600}
.strip{display:flex;gap:6px;margin-top:8px;overflow-x:auto}
.strip button{border:0;padding:0;background:none;cursor:zoom-in;flex:0 0 auto}
.strip img{width:84px;height:84px;object-fit:cover;border-radius:12px;display:block;background:var(--tint)}
.up video,.up .thx{margin-top:8px;max-width:100%;width:340px;border-radius:14px;background:#000;display:block}
.up .thx{background:var(--tint);aspect-ratio:4/3;object-fit:cover}
.up.anniv{background:linear-gradient(135deg,#FFF6E0,#FDE7C2);border-color:#F3D49A}
.empty{background:var(--card);border:1px dashed var(--edge);border-radius:20px;padding:20px;text-align:center;color:var(--muted)}
.more{margin-top:12px}
/* help band */
.band{margin-top:34px;border-radius:var(--R);background:var(--ink);color:#FFFFFF;padding:24px 20px;display:grid;gap:18px}
.band h2{margin:0;font-size:clamp(24px,3.4vw,34px);letter-spacing:-.03em;line-height:1.1}
.band p{margin:6px 0 0;color:#CFE8FA}
.band .acts{display:flex;flex-wrap:wrap;gap:10px}
@media (min-width:860px){.band{grid-template-columns:1.2fr 1fr;align-items:center;padding:34px 40px}.band .acts{justify-content:flex-end}}
footer{margin:34px 0 0;padding:22px 16px 34px;text-align:center;color:var(--muted);font-size:calc(13px*var(--fs));border-top:1px solid var(--line)}
footer a{font-weight:700}
/* project detail */
.ov{position:fixed;inset:0;z-index:1400;background:rgba(4,38,63,.45);opacity:0;transition:opacity .2s;display:flex;justify-content:flex-end}
.ov.on{opacity:1}
.ov.hidden,.more.hidden{display:none}
.det{background:var(--bg);width:100%;max-width:640px;height:100%;overflow-y:auto;overscroll-behavior:contain;transform:translateX(40px);transition:transform .25s ease;outline:none}
.ov.on .det{transform:none}
.dbar{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:8px;padding:10px 12px;background:rgba(250,248,243,.95);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.dbar b{flex:1;font-size:calc(15px*var(--fs));overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.iconbtn{width:44px;height:44px;border-radius:50%;border:0;background:#FFFFFF;box-shadow:0 1px 4px rgba(4,38,63,.15);display:inline-flex;align-items:center;justify-content:center;cursor:pointer;color:var(--ink);flex:0 0 auto}
.iconbtn svg{width:22px;height:22px}
.dbody{padding:0 16px 40px}
.gal{display:flex;gap:8px;overflow-x:auto;scroll-snap-type:x mandatory;margin:12px -16px 0;padding:0 16px;scrollbar-width:thin}
.gal figure{margin:0;flex:0 0 86%;scroll-snap-align:center;position:relative}
.gal img{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:20px;display:block;background:var(--tint)}
.gal figcaption{position:absolute;left:10px;bottom:10px;background:rgba(4,38,63,.72);color:#FFFFFF;font-size:calc(12px*var(--fs));font-weight:600;border-radius:999px;padding:3px 10px}
.gal.one figure{flex-basis:100%}
.nophoto{margin-top:12px;border-radius:20px;background:var(--tint);color:var(--deep);padding:18px;font-size:calc(14px*var(--fs));display:flex;gap:12px;align-items:center}
.nophoto svg{width:26px;height:26px;flex:0 0 auto}
.dt h1{font-size:clamp(28px,6vw,40px);line-height:1.05;letter-spacing:-.03em;margin:18px 0 6px;font-weight:800;color:#0A0A0A}
.dt .where{color:var(--muted);font-weight:600;margin:0}
.dt .st{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:10px}
.facts2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px}
.facts2 div{background:#FFFFFF;border:1px solid var(--line);border-radius:18px;padding:12px 14px;min-width:0}
.facts2 span{display:block;font-size:calc(12px*var(--fs));font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.facts2 b{display:block;font-size:calc(18px*var(--fs));color:var(--ink);letter-spacing:-.01em;overflow-wrap:anywhere}
.facts2 .big b{font-size:calc(26px*var(--fs))}
.dacts{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}
.dacts .btn{flex:1 1 auto}
.coords{margin-top:8px;font-size:calc(13px*var(--fs));color:var(--muted);font-weight:600}
.dt h2{font-size:calc(21px*var(--fs));letter-spacing:-.02em;margin:28px 0 10px;color:#0A0A0A}
.tl{list-style:none;margin:0;padding:0 0 0 18px;border-left:2px solid var(--line)}
.tl li{position:relative;padding:0 0 16px 14px}
.tl li::before{content:"";position:absolute;left:-26px;top:4px;width:14px;height:14px;border-radius:50%;background:var(--c,var(--blue));box-shadow:0 0 0 3px var(--bg)}
.tl b{display:block;font-size:calc(15px*var(--fs));color:var(--ink)}
.tl time{font-size:calc(12px*var(--fs));color:var(--muted);font-weight:600}
.tl .facts{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.tl .facts span{background:#FFFFFF;border:1px solid var(--line);border-radius:999px;padding:3px 10px;font-size:calc(12px*var(--fs));font-weight:600}
.rep{background:#FFFFFF;border:1px solid var(--line);border-radius:18px;padding:14px;margin-bottom:10px}
.rep b{color:var(--ink)}
.rep p{margin:4px 0 0;font-size:calc(14px*var(--fs))}
.quote{margin:0 0 10px;background:var(--tint);border-radius:20px;padding:16px 18px;font-size:calc(17px*var(--fs));font-weight:600;color:var(--ink)}
.quote cite{display:block;font-size:calc(13px*var(--fs));font-style:normal;color:var(--muted);margin-top:4px}
.thanks{display:grid;grid-template-columns:1fr;gap:10px}
.thanks figure{margin:0;background:#FFFFFF;border:1px solid var(--line);border-radius:18px;overflow:hidden}
.thanks img,.thanks video{width:100%;display:block;max-height:420px;object-fit:cover;background:#000}
.thanks figcaption{padding:10px 12px;font-size:calc(14px*var(--fs));font-weight:600}
/* before and after */
.ba{position:relative;margin-top:12px;border-radius:20px;overflow:hidden;aspect-ratio:4/3;background:var(--tint);user-select:none;touch-action:pan-y}
.ba img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;pointer-events:none}
.ba .after{clip-path:inset(0 0 0 var(--x,50%))}
.ba .line{position:absolute;top:0;bottom:0;left:var(--x,50%);width:3px;margin-left:-1.5px;background:#FFFFFF;box-shadow:0 0 6px rgba(0,0,0,.4);pointer-events:none}
.ba .knob{position:absolute;top:50%;left:var(--x,50%);width:46px;height:46px;margin:-23px 0 0 -23px;border-radius:50%;background:#FFFFFF;box-shadow:0 4px 12px rgba(0,0,0,.35);display:flex;align-items:center;justify-content:center;color:var(--ink);pointer-events:none}
.ba .knob svg{width:24px;height:24px}
.ba .tag{position:absolute;top:10px;background:rgba(4,38,63,.75);color:#FFFFFF;font-size:calc(12px*var(--fs));font-weight:700;border-radius:999px;padding:4px 10px;pointer-events:none}
.ba .tag.l{left:10px}.ba .tag.r{right:10px}
.ba input{position:absolute;inset:0;width:100%;height:100%;margin:0;opacity:0;cursor:ew-resize}
.ba:focus-within{outline:3px solid var(--blue);outline-offset:2px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:1700;background:var(--ink);color:#FFFFFF;padding:12px 18px;border-radius:999px;font-weight:700;font-size:calc(14px*var(--fs));box-shadow:0 8px 20px rgba(0,0,0,.25);max-width:90vw;text-align:center}
/* states */
.skel{border-radius:var(--R);background:linear-gradient(90deg,#ECEEF0 25%,#F6F7F8 50%,#ECEEF0 75%);background-size:200% 100%;animation:sk 1.2s infinite}
@keyframes sk{to{background-position:-200% 0}}
.gone{max-width:520px;margin:60px auto;text-align:center;padding:0 16px}
.gone .ic{width:72px;height:72px;border-radius:24px;background:var(--tint);color:var(--blue);display:inline-flex;align-items:center;justify-content:center}
.gone .ic svg{width:36px;height:36px}
.gone h1{font-size:calc(30px*var(--fs));letter-spacing:-.03em;margin:18px 0 8px}
.gone p{color:var(--muted)}
.gone .acts{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-top:20px}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
/* ---- easier for older eyes: text size (A / A+ / A++), stronger contrast ---- */
html{--fs:1.08}
html.ts-l{--fs:1.22}
html.ts-xl{--fs:1.38}
.tsz{display:inline-flex;border:1px solid var(--edge);border-radius:14px;overflow:hidden;background:#FFFFFF}
.tsz button{border:0;background:none;min-width:46px;min-height:46px;font-weight:800;color:var(--ink);cursor:pointer;line-height:1}
.tsz button:nth-child(1){font-size:15px}.tsz button:nth-child(2){font-size:19px}.tsz button:nth-child(3){font-size:23px}
.tsz button[aria-pressed=true]{background:var(--ink);color:#FFFFFF}
